name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m spacy download en_core_web_sm

      - name: Validate dataset configs
        run: steb validate

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_retrieval.py \
            --ignore=tests/test_stel_dataset.py \
            --ignore=tests/test_causal_model.py \
            -v
