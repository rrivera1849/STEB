site_name: STEB
site_description: Style Text Embedding Benchmark
site_url: https://steb.readthedocs.io
repo_url: https://github.com/rrivera1849/STEB
repo_name: rrivera1849/STEB

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage:
      - CLI: usage/cli.md
      - Python API: usage/python-api.md
  - Tasks:
      - Overview: tasks/overview.md
      - Clustering: tasks/clustering.md
      - All-to-All Pair Classification: tasks/all-to-all-pair-classification.md
      - Pre-defined Pair Classification: tasks/pre-defined-pair-classification.md
      - Order Alignment: tasks/order-alignment.md
      - Retrieval: tasks/retrieval.md
      - Probing: tasks/probing.md
      - Hungarian Algorithm: tasks/hungarian-algorithm.md
  - Developer Guide:
      - Adding Models: developer/adding-models.md
      - Adding Datasets: developer/adding-datasets.md
      - Running Tests: developer/running-tests.md
  - API Reference: api-reference.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            members_order: source
